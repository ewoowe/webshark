<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebShark - 网络抓包工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦈 WebShark</h1>
            <p class="subtitle">基于 Web 的网络流量抓包分析工具</p>
        </header>

        <!-- 连接配置区域 -->
        <section id="connection-section" class="panel">
            <h2>远程主机连接</h2>
            <div class="form-group">
                <label for="host">主机地址:</label>
                <input type="text" id="host" placeholder="例如: 192.168.1.100" required>
            </div>
            <div class="form-group">
                <label for="username">用户名:</label>
                <input type="text" id="username" placeholder="例如: root" required>
            </div>
            <div class="form-group">
                <label for="password">密码:</label>
                <input type="password" id="password" placeholder="输入密码" required>
            </div>
            <button id="connect-btn" class="btn btn-primary">获取网卡列表</button>
        </section>

        <!-- 网卡选择区域 -->
        <section id="interface-section" class="panel" style="display: none;">
            <h2>选择网卡</h2>
            <div id="interface-list" class="checkbox-group"></div>
            <div class="button-group">
                <button id="select-all-interfaces" class="btn btn-secondary">全选</button>
                <button id="deselect-all-interfaces" class="btn btn-secondary">取消全选</button>
            </div>
        </section>

        <!-- 过滤器配置区域 -->
        <section id="filter-section" class="panel" style="display: none;">
            <h2>过滤器配置</h2>
            <div class="form-group">
                <label for="bpf-filter">BPF 过滤器 (tcpdump):</label>
                <input type="text" id="bpf-filter" placeholder="例如: tcp port 80">
                <small>常用示例: tcp port 80, host 192.168.1.1, not port 22</small>
            </div>
            <div class="form-group">
                <label for="wireshark-filter">Wireshark 过滤器:</label>
                <input type="text" id="wireshark-filter" placeholder="例如: http.request.method == GET">
                <small>常用示例: http, dns, ip.addr == 192.168.1.1</small>
            </div>
            <button id="start-capture-btn" class="btn btn-success">开始抓包</button>
        </section>

        <!-- 抓包结果显示区域 -->
        <section id="capture-section" class="panel" style="display: none;">
            <div class="capture-header">
                <h2>抓包结果</h2>
                <div class="capture-controls">
                    <span id="packet-count" class="badge">0 个数据包</span>
                    <button id="stop-capture-btn" class="btn btn-danger">停止抓包</button>
                    <button id="clear-packets-btn" class="btn btn-secondary">清空</button>
                </div>
            </div>
            
            <!-- 数据包列表 -->
            <div id="packet-table-container">
                <table id="packet-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Time</th>
                            <th>Source</th>
                            <th>Destination</th>
                            <th>Protocol</th>
                            <th>Length</th>
                            <th>Info</th>
                        </tr>
                    </thead>
                    <tbody id="packet-list">
                    </tbody>
                </table>
            </div>

            <!-- 数据包详情 -->
            <div id="packet-detail-container">
                <h3>数据包详情</h3>
                <pre id="packet-detail">点击数据包查看详细信息</pre>
            </div>
        </section>

        <!-- 状态提示 -->
        <div id="status-message" class="status-message"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
